name: Go CI/CD Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: write
  pull-requests: read

jobs:

  # Linux 宿主: 单元测试 + 编译级校验全部发布目标
  test:
    name: Go Test and Vet (Linux)
    strategy:
      matrix:
        # go.mod 的依赖 golang.org/x/sys v0.15.0 要求 go>=1.18, 统一用 1.21.13
        go: ["1.21.13"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Run go vet
        run: go vet ./...

      - name: Run unit tests
        run: go test ./...

      - name: Build check
        run: go build ./...

      # 仅编译级校验全部发布目标; darwin 的 CPU 采集功能依赖 cgo,
      # 编译通过不代表功能可用, 运行时正确性由 test-darwin 与原生构建保证
      - name: Cross-compile check (release targets)
        shell: bash
        run: |
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go build ./... || exit 1
          done

  # macOS 宿主: 验证 cgo 开启(原生构建)时能编译通过并跑通测试
  test-darwin:
    name: Go Test (macOS, native cgo)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21.13"

      # macOS 上 CPU 采集依赖 cgo(gopsutil), 必须验证 CGO_ENABLED=1 可编译
      - name: Build check (cgo enabled)
        run: CGO_ENABLED=1 go build ./...

      - name: Run unit tests
        run: go test ./...

  # 根据现有 tag 自增得到新版本号(仅 push master 时执行)
  resolve-version:
    name: Resolve Version
    needs: [test, test-darwin]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set-up-tag.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up tag
        id: set-up-tag
        run: |
          latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "Latest tag: $latest_tag"

          tag="v0.0.1"
          if [ ! -z "$latest_tag" ]; then
            latest_tag=$(echo $latest_tag | sed 's/^v//')
            IFS='.' read -r major minor patch <<< "$latest_tag"
            if ! [[ "$major" =~ ^[0-9]+$ ]] || ! [[ "$minor" =~ ^[0-9]+$ ]] || ! [[ "$patch" =~ ^[0-9]+$ ]]; then
              echo "Error: Version numbers must be integers."
              exit 1
            fi
            if (( patch < 9 )); then
              patch=$((patch + 1))
            elif (( patch == 9 && minor < 9 )); then
              patch=0
              minor=$((minor + 1))
            elif (( patch == 9 && minor == 9 )); then
              patch=0
              minor=0
              major=$((major + 1))
            else
              echo "Error: Invalid version numbers: major=$major, minor=$minor, patch=$patch"
              exit 1
            fi
            tag="v$major.$minor.$patch"
          fi
          echo "New version: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # 逐个目标构建并上传产物:
  #   - darwin 必须在 macOS runner 上原生 cgo 构建(Xcode/clang), 否则 CPU 不可用
  #   - linux 无 cgo 依赖, 在 ubuntu 上交叉编译即可
  build-artifacts:
    name: Build ${{ matrix.name }}
    needs: resolve-version
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: darwin-amd64
            target: darwin/amd64
            runs-on: macos-latest
          - name: darwin-arm64
            target: darwin/arm64
            runs-on: macos-latest
          - name: linux-amd64
            target: linux/amd64
            runs-on: ubuntu-latest
          - name: linux-arm64
            target: linux/arm64
            runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21.13"

      - name: Compile ${{ matrix.target }}
        run: bash build.sh "${{ needs.resolve-version.outputs.tag }}" "${{ matrix.target }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sysmon-${{ matrix.name }}
          path: target/*

  create-release:
    name: Create Release
    needs: [resolve-version, build-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: target
          merge-multiple: true

      - name: Get latest commit message
        id: get_commit_message
        run: |
          echo "$(git log -1 --pretty=%B)" > commit_message.txt
          cat commit_message.txt

      - name: Create tag
        shell: bash
        run: |
          git config --global user.name 'github-actions-bot'
          git config --global user.email 'github-actions-bot@users.noreply.github.com'
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping tag creation"
          else
            git tag -a "$TAG" -F commit_message.txt
            git push origin "$TAG"
          fi
        env:
          TAG: ${{ needs.resolve-version.outputs.tag }}

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          name: ${{ needs.resolve-version.outputs.tag }}
          body_path: commit_message.txt
          files: target/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}